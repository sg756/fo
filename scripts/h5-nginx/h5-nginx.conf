# =============================================================================
# H5 专用 nginx（另一台小机）— 只改本文件
# 安装：sudo bash scripts/h5-nginx/install.sh
# =============================================================================

# -----------------------------------------------------------------------------
# LISTEN_PORT
# 作用：本机对外网页端口（浏览器访问 H5）。
# -----------------------------------------------------------------------------
LISTEN_PORT=80

# -----------------------------------------------------------------------------
# WEB_ROOT
# 作用：放置 apps/mobile/dist 导出内容的目录（index.html 等）。
# -----------------------------------------------------------------------------
WEB_ROOT=/var/www/floworder-h5

# -----------------------------------------------------------------------------
# SITE_NAME
# 作用：nginx 站点配置文件名（写入 conf.d 或 sites-available）。
# -----------------------------------------------------------------------------
SITE_NAME=floworder-h5

# -----------------------------------------------------------------------------
# API_HOST
# 作用：多用户管理系统 API 所在机（内网 IP）。nginx 把 /api 反代到这里。
# -----------------------------------------------------------------------------
API_HOST=192.168.0.3

# -----------------------------------------------------------------------------
# API_PORT
# 作用：API 机 Nest 监听端口（与业务机实际 PORT 一致，常见 80）。
# -----------------------------------------------------------------------------
API_PORT=80

# -----------------------------------------------------------------------------
# SERVER_NAME
# 作用：nginx server_name。空或 _ = 接受任意 Host。
# -----------------------------------------------------------------------------
SERVER_NAME=_

# -----------------------------------------------------------------------------
# CLIENT_MAX_BODY_M
# 作用：上传/请求体上限（MB）。登录注册一般很小，留余量即可。
# -----------------------------------------------------------------------------
CLIENT_MAX_BODY_M=20

# -----------------------------------------------------------------------------
# PROXY_CONNECT_TIMEOUT / PROXY_SEND_TIMEOUT / PROXY_READ_TIMEOUT
# 作用：反代 API 超时（秒）。
# -----------------------------------------------------------------------------
PROXY_CONNECT_TIMEOUT=5
PROXY_SEND_TIMEOUT=60
PROXY_READ_TIMEOUT=60

# -----------------------------------------------------------------------------
# KEEPALIVE_UPSTREAM
# 作用：到 API 机的空闲长连接数（省握手）。
# -----------------------------------------------------------------------------
KEEPALIVE_UPSTREAM=32

# -----------------------------------------------------------------------------
# ACCESS_LOG
# 作用：on=写访问日志；off=关闭（小机省磁盘 IO，排障可临时开）。
# -----------------------------------------------------------------------------
ACCESS_LOG=on
