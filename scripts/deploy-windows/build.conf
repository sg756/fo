# =============================================================================
# users-manager · Windows 构建配置（只改本文件）
# 被谁读取：同目录 build.ps1
# 详细流程：同目录 README.txt
#
# 路径对照（不要和 Linux 的 APP_ROOT 搞混）：
#   SOURCE_ROOT  = 本机「源码根」（编译输入：apps\admin、apps\api）
#   RELEASE_DIR  = 本机「上传包」（编译输出，结构对齐 Linux APP_ROOT）
#   Linux APP_ROOT = 服务器部署目录（install-env/floworder.conf）
# =============================================================================

# -----------------------------------------------------------------------------
# SOURCE_ROOT
# 作用：本机源码根目录（下面应有 apps\admin、apps\api）。这是编译「输入」。
# 空：自动用本仓库根目录（scripts 的上两级）。
# 注意：除非 SKIP_CONFIRM=true，否则编译前仍会弹窗让你确认/改路径。
# 示例：SOURCE_ROOT=D:\project\FlowOrder
# -----------------------------------------------------------------------------
SOURCE_ROOT=D:\project\FlowOrder

# -----------------------------------------------------------------------------
# RELEASE_DIR
# 作用：编译完成后组装的「上传包」目录（这是编译「输出」）。
# 目录内相对路径与 Linux APP_ROOT 一致，上传时原样覆盖，无需改名。
# 空：默认 SOURCE_ROOT\dist-release
# 内容：
#   dist-release\apps\admin\dist\
#   dist-release\apps\api\dist\
#   dist-release\apps\api\package.json / package-lock.json / prisma\
# 上传：把 RELEASE_DIR「里面的内容」盖到服务器 APP_ROOT（勿传 node_modules）
# -----------------------------------------------------------------------------
RELEASE_DIR=

# -----------------------------------------------------------------------------
# NODE_HOME
# 作用：便携版 Node.js 的安装目录（node.exe / npm.cmd 放在这里）。
# 何时用：本机没有 Node 20+（或版本不够）时，脚本下载官方 zip 解压到此目录。
# 本机已有合格 Node：不会下载，也不会改这个目录。
# 可用环境变量，如 %LOCALAPPDATA%、%USERPROFILE%。
# 一般无需管理员；不要填系统 Program Files，除非你有意为之。
# 示例：NODE_HOME=D:\tools\node
# -----------------------------------------------------------------------------
NODE_HOME=D:\tools\node

# -----------------------------------------------------------------------------
# PRISMA_MODE
# 作用：编译阶段是否对本机数据库做 Prisma 同步。
# 可选值：
#   skip   = 不同步（推荐；生产库在 Linux，由 apply-dist 或 deploy/run/build 处理）
#   none   = 同 skip
#   push   = 执行 prisma db push（本机已配好 DATABASE_URL 时）
#   deploy = 执行 prisma migrate deploy（有 migration 历史时）
# -----------------------------------------------------------------------------
PRISMA_MODE=skip

# -----------------------------------------------------------------------------
# SKIP_CONFIRM
# 作用：是否跳过所有交互确认（源码目录确认、开始编译确认、下载 Node 确认）。
#   false = 交互（推荐给人用）
#   true  = 全自动（适合定时任务 / CI；请先写好 SOURCE_ROOT）
# 也可临时命令行：build.ps1 -Yes（效果同 true，不改本文件）
# -----------------------------------------------------------------------------
SKIP_CONFIRM=false
