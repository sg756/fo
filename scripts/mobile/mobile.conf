# =============================================================================
# App（Expo）打包配置 — 方案 B / C 共用
# 被谁读取：scripts/mobile/common.ps1 以及 B、C 目录下脚本
# 方式：EAS 云构建，本机无需 Android Studio / SDK
# =============================================================================

# -----------------------------------------------------------------------------
# API_BASE
# 作用：手机 App（APK）访问后端的完整根地址，须含 /api。
# 打包 Android / 热更新 / 导出 H5 前由脚本写入 apps/mobile/src/api/api.endpoint.ts。
# 例：本机 http://127.0.0.1:3000/api ；真机局域网 http://192.168.31.112:3000/api
#     线上 http://47.239.235.77/api
# -----------------------------------------------------------------------------
API_BASE_BACKUP=http://127.0.0.1:3000/api
API_BASE=http://127.0.0.1:3000/api

# -----------------------------------------------------------------------------
# WEB_API_BASE
# 作用：H5（expo export web）用的后端地址；空 = 与 API_BASE 相同。
# 本机浏览器调试 H5：http://localhost:3000/api
# -----------------------------------------------------------------------------
WEB_API_BASE_BACKUP=http://localhost:3000/api
WEB_API_BASE=http://localhost:3000/api

# -----------------------------------------------------------------------------
# APP_ROOT
# 作用：仓库根目录（下面应有 apps\mobile）。
# 空：自动用本文件上两级（scripts 的上级 = 仓库根）。
# -----------------------------------------------------------------------------
APP_ROOT=D:\project\FlowOrder

# -----------------------------------------------------------------------------
# MOBILE_DIR
# 作用：相对 APP_ROOT 的 mobile 工程目录。一般不用改。
# -----------------------------------------------------------------------------
MOBILE_DIR=apps\mobile

# -----------------------------------------------------------------------------
# NODE_HOME
# 作用：便携 Node 目录（无系统 Node 20+ 时自动下载到此）。
# 本机已有 Node 20+：直接用系统的，不强制下载。
# -----------------------------------------------------------------------------
NODE_HOME=%LOCALAPPDATA%\users-manager-build\node

# -----------------------------------------------------------------------------
# EAS_PROFILE
# 作用：默认 EAS 构建档（见 apps/mobile/eas.json）。
#   preview     = 内测 APK
#   production  = 正式 APK（可直接装手机，默认）
#   store       = 上架 AAB（仅 Google Play；菜单单独一项）
#   development = 开发客户端
# 方案 B / 方案 C「正式 APK」用 production；上架用 store。
# -----------------------------------------------------------------------------
EAS_PROFILE=production

# -----------------------------------------------------------------------------
# EAS_NON_INTERACTIVE
# 作用：eas build / eas update 是否加 --non-interactive（已登录且项目已关联时可用）。
#   true  = 少提问（CI / 熟练后）
#   false = 允许 EAS 交互（首次更友好）
# -----------------------------------------------------------------------------
EAS_NON_INTERACTIVE=false

# -----------------------------------------------------------------------------
# SKIP_CONFIRM
# 作用：是否跳过源码目录等确认。
#   false = 交互确认（推荐给人用）
#   true  = 跳过确认
# -----------------------------------------------------------------------------
SKIP_CONFIRM=false
