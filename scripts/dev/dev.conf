# =============================================================================
# 本机 Windows 开发环境（只改本文件）
# 被谁读取：同目录 install-dev.ps1 / setup-dev-db.ps1（经 common.ps1）
# =============================================================================

# -----------------------------------------------------------------------------
# APP_ROOT
# 作用：仓库根目录（下面应有 apps\api、apps\admin）。
# 空：自动用本文件上两级（scripts 的上级 = 仓库根）。
# -----------------------------------------------------------------------------
APP_ROOT=

# -----------------------------------------------------------------------------
# NODE_HOME
# 作用：便携 Node 目录（无系统 Node 20+ 时自动下载到此）。
# -----------------------------------------------------------------------------
NODE_HOME=%LOCALAPPDATA%\users-manager-build\node

# -----------------------------------------------------------------------------
# SKIP_CONFIRM
# 作用：是否跳过确认（下载 Node、开始安装）。
#   false = 交互
#   true  = 全自动
# 也可命令行：install-dev.ps1 -Yes
# -----------------------------------------------------------------------------
SKIP_CONFIRM=false
