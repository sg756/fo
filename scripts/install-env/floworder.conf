# =============================================================================
# users-manager · 服务器配置（只改本文件）
# 位置：scripts/install-env/（公共底座，纯 Linux / Windows 发版都先读这里）
# 被谁读取（均与脚本同目录读 floworder.conf，或仓库内指向本文件）：
#   install-env/install.sh、configure.sh、apply-dist.sh
#   deploy/run/*、deploy/ops/*（仓库布局下指向上级 install-env）
# 流程：同目录 README.txt ；总览 ../README.txt
# =============================================================================

# -----------------------------------------------------------------------------
# APP_ROOT
# 作用：服务器上本仓库的根目录（clone/上传必须放到这里）。
# 禁止放在 /root 下：/root 默认权限 700，业务用户 users-manager 进不去，
#   会导致 npm 读不到 package-lock.json 并误报「没有 lock」（EACCES）。
# 推荐：/opt/users-manager
# install 只会 mkdir；代码与 .env 在「放好仓库 + configure」之后才完整。
# -----------------------------------------------------------------------------
APP_ROOT=/opt/dist-release

# -----------------------------------------------------------------------------
# PORT
# 作用：业务服务对外监听端口（Nest 直听，无需 Nginx）。
# configure 写入 systemd Environment=PORT，并写入 apps/api/.env 的 PORT。
# -----------------------------------------------------------------------------
PORT=80

# -----------------------------------------------------------------------------
# SERVICE_NAME
# 作用：systemd 单元名（configure 生成 /etc/systemd/system/<名>.service）。
# -----------------------------------------------------------------------------
SERVICE_NAME=users-manager

# -----------------------------------------------------------------------------
# LOG_DIR
# 作用：业务服务 stdout/stderr 落盘目录（configure 写入按天日志）。
# 空 = ${APP_ROOT}/logs
# 当天：tail -f ${LOG_DIR}/api-$(date +%Y-%m-%d).log
# 历史：ls ${LOG_DIR}/api-????-??-??.log
# -----------------------------------------------------------------------------
LOG_DIR=

# -----------------------------------------------------------------------------
# RUN_USER
# 作用：运行 Node 的系统用户（install 创建）。
# -----------------------------------------------------------------------------
RUN_USER=users-manager

# -----------------------------------------------------------------------------
# GIT_REPO_URL
# 作用：纯 Linux 拉代码脚本 deploy/ops/pull.sh 首次 clone 用的仓库地址。
# 已有 .git 时 pull.sh 只做 git pull，不再用此项 clone。
# 示例：GIT_REPO_URL=https://github.com/你的账号/FlowOrder.git
#       或 git@github.com:你的账号/FlowOrder.git（需配好 RUN_USER 的 SSH 密钥）
# -----------------------------------------------------------------------------
GIT_REPO_URL=

# -----------------------------------------------------------------------------
# GIT_BRANCH
# 作用：pull.sh 首次 clone / 切换分支时使用的分支名。
# -----------------------------------------------------------------------------
GIT_BRANCH=main

# -----------------------------------------------------------------------------
# GIT_PULL
# 作用：仅 deploy/ops/publish.sh：是否在构建前自动 git pull。
#   true  = publish 时顺带 pull（仓库需已存在）
#   false = publish 不 pull（可先单独跑 ops/pull.sh）
# -----------------------------------------------------------------------------
GIT_PULL=false

# -----------------------------------------------------------------------------
# PRISMA_MODE
# 作用：deploy/run/build、ops/publish、apply-dist 同步库结构。
#   push | deploy | skip
# -----------------------------------------------------------------------------
PRISMA_MODE=push

# =============================================================================
# 本机数据库
# install（MYSQL_AUTO=true）建库建用户；configure 再把 DATABASE_URL 写入 .env
# =============================================================================

MYSQL_AUTO=true
DB_HOST=127.0.0.1
DB_PORT=3306
DB_NAME=users_manager
DB_USER=users_manager
DB_PASS=ChangeMe_DbPass_2026

# MariaDB/MySQL 的 root 密码（不是 Linux 系统 root）
# 留空：install.sh 会用 socket 免密连上后自动生成并写回本文件（加单引号）
# 已有值：install 会尽量用该密码；连不上则通过 socket 重置为该值并写回
MYSQL_ROOT_PASSWORD=
