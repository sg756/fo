# =============================================================================
# users-manager · 服务器配置（只改本文件）
# 位置：scripts/install-env/（服务器底座，Windows 发版先读这里）
# 被谁读取（均读本文件）：
#   install-env/install.sh、configure.sh、apply-dist.sh
#   deploy/run/start.sh、restart.sh、stop.sh
# 流程：同目录 README.txt ；总览 ../README.txt
# =============================================================================

# -----------------------------------------------------------------------------
# APP_ROOT
# 作用：服务器上发布包根目录（含 apps/api/dist、apps/admin/dist）。
# 一键安装：解压后会自动扫描真实源码根并写回本项，一般不用手填。
# 空机默认先下到 /opt/dist-release；若 zip 多一层目录也会扫到内层再改 APP_ROOT。
# 禁止放在 /root 下（业务用户进不去会导致 npm EACCES）。
# -----------------------------------------------------------------------------
APP_ROOT=/opt/dist-release

# -----------------------------------------------------------------------------
# PORT
# 作用：业务服务对外监听端口（Nest 直听，无需 Nginx）。
# configure 写入 systemd Environment=PORT，并写入 apps/api/.env 的 PORT。
# -----------------------------------------------------------------------------
PORT=80

# -----------------------------------------------------------------------------
# SERVICE_NAME
# 作用：systemd 单元名（configure 生成 /etc/systemd/system/<名>.service）。
# -----------------------------------------------------------------------------
SERVICE_NAME=users-manager

# -----------------------------------------------------------------------------
# LOG_DIR
# 作用：业务服务 stdout/stderr 落盘目录（configure 写入按天日志）。
# 空 = ${APP_ROOT}/logs
# 当天：tail -f ${LOG_DIR}/api-$(date +%Y-%m-%d).log
# 历史：ls ${LOG_DIR}/api-????-??-??.log
# -----------------------------------------------------------------------------
LOG_DIR=

# -----------------------------------------------------------------------------
# RUN_USER
# 作用：运行 Node 的系统用户（install 创建）。
# -----------------------------------------------------------------------------
RUN_USER=users-manager

# -----------------------------------------------------------------------------
# PRISMA_MODE
# 作用：apply-dist 同步库结构。
#   push | deploy | skip
# -----------------------------------------------------------------------------
PRISMA_MODE=push

# =============================================================================
# 本机数据库
# install（MYSQL_AUTO=true）建库建用户；configure 再把 DATABASE_URL 写入 .env
# =============================================================================

MYSQL_AUTO=true
DB_HOST=127.0.0.1
DB_PORT=3306
# 一键安装时必须在命令行传入（会写回本文件）：
#   --db-user=账号 --db-pass='你的密码' --mysql-root-pass='你的root密码'
# 库名可省略，默认 users_manager。再跑同一条即更新，不改 .env 私钥。
DB_NAME=users_manager
DB_USER=users_flow
DB_PASS=ChangeMe_DbPass_2026

# MariaDB/MySQL 的 root 密码（不是 Linux 系统 root，也不是上面的 DB_PASS）
# 一键安装必须用 --mysql-root-pass 传入，脚本不自动生成。仓库里保持为空。
MYSQL_ROOT_PASSWORD=

# -----------------------------------------------------------------------------
# GITHUB_REPO / GITHUB_RELEASE_TAG
# 作用：空机一键 / fetch-dist 从 GitHub Release 拉 dist-release.zip。
# 私有仓库可先 export GH_TOKEN=... 再跑脚本。
# -----------------------------------------------------------------------------
GITHUB_REPO=sg756/fo
GITHUB_RELEASE_TAG=dist
