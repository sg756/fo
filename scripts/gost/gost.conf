# =============================================================================
# GOST 代理配置（只改本文件）
# 被谁读取：install-gost-centos9.sh / update-gost-config.sh
# 详细流程：同目录 README.txt ；总览见 ../README.txt
# =============================================================================
# 用法：
#   首次：改配置 → sudo bash install-gost-centos9.sh
#   以后：改配置 → sudo bash update-gost-config.sh
# 关于 IP：
#   保持监听 0.0.0.0，不要填公网 IP。
#   装完脚本会打印：局域网 IP:端口 → proxyIP；公网 IP → 交易所白名单。
# =============================================================================

# -----------------------------------------------------------------------------
# GOST_USER
# 作用：代理鉴权用户名。
# 与 GOST_PASS 都留空 = 无鉴权（不校验账号密码）。
# 若启用鉴权：必须与 GOST_PASS 同时填写；只填一项会报错。
# -----------------------------------------------------------------------------
GOST_USER=

# -----------------------------------------------------------------------------
# GOST_PASS
# 作用：代理鉴权密码。
# 规则同 GOST_USER（都空=无鉴权；要鉴权则两项都填）。
# -----------------------------------------------------------------------------
GOST_PASS=

# -----------------------------------------------------------------------------
# GOST_PORT
# 作用：代理服务监听端口（必填）。中间件 / 业务侧 proxyIP 填「IP:此端口」。
# -----------------------------------------------------------------------------
GOST_PORT=1080

# -----------------------------------------------------------------------------
# GOST_LISTEN
# 作用：监听网卡地址。保持 0.0.0.0 = 所有网卡。
# 不要改成某张公网 IP（否则容易只绑错地址或无法从内网访问）。
# -----------------------------------------------------------------------------
GOST_LISTEN=0.0.0.0
